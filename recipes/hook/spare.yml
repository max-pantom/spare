schema: spare.recipe/v1
id: hook
name: Hook
version: 0.1.0
description: Receive, inspect, and replay webhook requests on the local network.
support:
  systems:
    - darwin
    - windows
    - linux
  architectures:
    - amd64
    - arm64
runtime:
  type: native
resources:
  memoryRecommendedBytes: 67108864
  memoryMaximumBytes: 268435456
  cpuMaximum: 1
  storageMinimumBytes: 0
network:
  visibility: local
  port: automatic
storage:
  pathField: ""
  readOnly: false
health:
  type: http
  path: /
  intervalSeconds: 10
  failureThreshold: 3
config: {}
permissions:
  filesystem: {}
  network:
    local: true
    internet: true
  startOnLogin: true
  runInBackground: true
