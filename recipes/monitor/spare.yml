schema: spare.recipe/v1
id: monitor
name: Monitor
version: 0.1.0
description: Know when websites, devices, or local services go offline.
support:
  systems: [darwin, windows, linux]
  architectures: [amd64, arm64]
runtime:
  type: native
resources:
  memoryRecommendedBytes: 67108864
  memoryMaximumBytes: 268435456
  cpuMaximum: 1
  storageMinimumBytes: 0
network:
  visibility: local
  port: automatic
storage:
  readOnly: false
health:
  type: http
  path: /
  intervalSeconds: 10
  failureThreshold: 2
config:
  pairing-code:
    type: string
    label: Pairing code
    description: Leave blank to generate a six-digit code for trusted devices.
  check-interval:
    type: integer
    label: Check interval in seconds
    description: Monitor checks every target at this interval.
    default: 30
    minimum: 10
    maximum: 3600
permissions:
  filesystem: {}
  network:
    local: true
    internet: true
  startOnLogin: true
  runInBackground: true
