schema: spare.recipe/v1
id: downloads
name: Downloads
version: 0.1.0
description: Download large files in the background.
support:
  systems: [darwin, windows, linux]
  architectures: [amd64, arm64]
runtime:
  type: native
resources:
  memoryRecommendedBytes: 134217728
  memoryMaximumBytes: 536870912
  cpuMaximum: 1
  storageMinimumBytes: 262144000
network:
  visibility: local
  port: automatic
storage:
  pathField: destination
  readOnly: false
health:
  type: http
  path: /
  intervalSeconds: 10
  failureThreshold: 3
config:
  destination:
    type: directory
    label: Download folder
    description: Completed files and resumable partial downloads are kept here.
    required: true
  pairing-code:
    type: string
    label: Pairing code
    description: Leave blank to generate a six-digit code for trusted devices.
permissions:
  filesystem:
    read: [destination]
    write: [destination]
  network:
    local: true
    internet: true
  startOnLogin: true
  runInBackground: true
